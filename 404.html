<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Forge</title>
<style>
  :root {
    --bg: #f9f7f3; --text: #2b2b2b; --muted: #6b6b6b; --rule: #e5e0d8;
    --accent: #b06a3b; --link: #9a5a2f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1917; --text: #e9e6e0; --muted: #a5a09a; --rule: #38352f;
      --accent: #d9945f; --link: #e0a276;
    }
  }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--text);
    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { text-align: center; padding: 40px 24px; }
  .eyebrow {
    text-transform: uppercase; letter-spacing: 0.14em; font-size: 12px;
    font-weight: 600; color: var(--accent); margin: 0 0 12px;
  }
  h1 { font-size: 28px; margin: 0 0 10px; }
  p { color: var(--muted); margin: 0 0 20px; }
  a { color: var(--link); }
</style>
</head>
<body>
<main>
  <p class="eyebrow">Forge</p>
  <h1>Page not found</h1>
  <p>That page doesn&rsquo;t exist.</p>
  <a href="/">Go home</a> &nbsp;·&nbsp; <a href="/privacy">Privacy Policy</a>
</main>
</body>
</html>
