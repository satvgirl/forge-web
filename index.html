<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge</title>
<style>
  :root {
    --bg: #f9f7f3; --surface: #ffffff; --text: #2b2b2b;
    --muted: #6b6b6b; --rule: #e5e0d8; --accent: #b06a3b; --link: #9a5a2f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1917; --surface: #232120; --text: #e9e6e0;
      --muted: #a5a09a; --rule: #38352f; --accent: #d9945f; --link: #e0a276;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--text);
    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 460px; padding: 40px 24px; text-align: center; }
  .eyebrow {
    text-transform: uppercase; letter-spacing: 0.14em; font-size: 12px;
    font-weight: 600; color: var(--accent); margin: 0 0 12px;
  }
  h1 { font-size: 34px; margin: 0 0 12px; letter-spacing: -0.01em; }
  p { color: var(--muted); margin: 0 0 24px; }
  nav { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; }
  nav a {
    color: var(--link); text-decoration: none; font-size: 15px;
    border-bottom: 1px solid var(--rule); padding-bottom: 2px;
  }
  nav a:hover { border-color: currentColor; }
</style>
</head>
<body>
<main>
  <p class="eyebrow">Forge</p>
  <h1>Train. Grow your companion.</h1>
  <p>A strength-training app. Coming to the App&nbsp;Store.</p>
  <nav>
    <a href="/privacy">Privacy</a>
    <a href="/terms">Terms</a>
    <a href="/about">About</a>
  </nav>
</main>
</body>
</html>
